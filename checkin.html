<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kirish/Chiqish</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter',sans-serif; }
  body { background:#f5f4f1; min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:20px; min-height:100vh; display:flex; flex-direction:column; }
  .header { text-align:center; margin-bottom:20px; padding-top:16px; }
  .header h1 { font-size:20px; font-weight:800; color:#1a1a1a; }
  .header p { font-size:13px; color:#888; margin-top:4px; }

  .employee-select { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .employee-select label { font-size:11px; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:8px; }
  select { width:100%; padding:12px; border:1.5px solid #e5e2dc; border-radius:12px; font-size:15px; font-weight:600; background:#faf9f6; }

  .shift-status { background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; display:none; }
  .shift-status.on { display:block; }
  .shift-status .row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; }
  .shift-status .row b { color:#1a1a1a; }
  .zone-warning { background:#fdeaea; color:#c0392b; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; margin-top:8px; }

  .camera-box { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 2px 14px rgba(0,0,0,.06); margin-bottom:16px; position:relative; aspect-ratio:1; }
  video, .preview-img { width:100%; height:100%; object-fit:cover; display:block; }
  .camera-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#bbb; }

  .gps-status { display:flex; align-items:center; gap:8px; background:#fff; border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:13px; font-weight:600; }
  .gps-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .gps-ok { background:#e6f7ee; color:#0d8a4f; } .gps-ok .gps-dot { background:#0d8a4f; }
  .gps-wait { background:#fff8e6; color:#a67c00; } .gps-wait .gps-dot { background:#e0a800; animation:pulse 1s infinite; }
  .gps-bad { background:#fdeaea; color:#c0392b; } .gps-bad .gps-dot { background:#c0392b; }
  @keyframes pulse { 50%{opacity:.4} }

  .btn-row { display:flex; gap:10px; margin-bottom:12px; }
  button { border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; flex:1; }
  .btn-shoot { background:#1a1a1a; color:#fff; }
  .btn-checkin { background:#0d8a4f; color:#fff; }
  .btn-checkout { background:#c0392b; color:#fff; }
  .btn-retake { background:#eee; color:#555; }
  button:disabled { opacity:.4; cursor:not-allowed; }

  .msg { text-align:center; font-size:13px; padding:12px; border-radius:12px; margin-top:8px; font-weight:600; }
  .msg-ok { background:#e6f7ee; color:#0d8a4f; }
  .msg-err { background:#fdeaea; color:#c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Kirish / Chiqish</h1>
    <p id="clock">--:--:--</p>
  </div>

  <div class="employee-select">
    <label>Xodim</label>
    <select id="employeeSelect"><option value="">Yuklanmoqda...</option></select>
  </div>

  <div class="shift-status" id="shiftStatus">
    <div class="row">Smena boshlandi: <b id="shiftStart">—</b></div>
    <div class="row">Holat: <b id="shiftOnStatus">—</b></div>
    <div id="zoneWarning" style="display:none" class="zone-warning"></div>
  </div>

  <div class="gps-status gps-wait" id="gpsStatus">
    <div class="gps-dot"></div>
    <span id="gpsText">Joylashuv aniqlanmoqda...</span>
  </div>

  <div class="camera-box">
    <video id="video" autoplay playsinline style="display:none"></video>
    <img id="preview" class="preview-img" style="display:none">
    <div class="camera-placeholder" id="placeholder">
      <span style="font-size:40px">📷</span>
      <span style="font-size:13px">Kamerani yoqish uchun bosing</span>
    </div>
  </div>
  <canvas id="canvas" style="display:none"></canvas>

  <div class="btn-row">
    <button class="btn-shoot" id="btnShoot">📷 Kamerani yoqish</button>
  </div>
  <div class="btn-row" id="actionRow" style="display:none">
    <button class="btn-retake" id="btnRetake">↺ Qayta</button>
    <button class="btn-checkin" id="btnCheckin">✓ Kirish</button>
    <button class="btn-checkout" id="btnCheckout">✕ Chiqish</button>
  </div>

  <div id="msgBox"></div>
</div>

<script>
// ====== SOZLAMALAR ======
const API_URL = 'https://YOUR-BACKEND.up.railway.app/api';
const COMPANY_ID = 1;
const PING_INTERVAL_MS = 2 * 60 * 1000; // smena davomida har 2 daqiqada GPS yuboriladi
// =========================

let stream = null;
let capturedImage = null;
let currentLat = null, currentLon = null;
let onShift = false;
let pingTimer = null;

const video = document.getElementById('video');
const preview = document.getElementById('preview');
const placeholder = document.getElementById('placeholder');
const canvas = document.getElementById('canvas');
const btnShoot = document.getElementById('btnShoot');
const btnCheckin = document.getElementById('btnCheckin');
const btnCheckout = document.getElementById('btnCheckout');
const actionRow = document.getElementById('actionRow');
const msgBox = document.getElementById('msgBox');
const employeeSelect = document.getElementById('employeeSelect');

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('uz-UZ');
}, 1000);

// Xodimlar ro'yxati
fetch(`${API_URL}/employees/company/${COMPANY_ID}`)
  .then(r => r.json())
  .then(list => {
    employeeSelect.innerHTML = list.map(e => `<option value="${e.id}">${e.fullName} — ${e.position}</option>`).join('');
    checkShiftStatus();
  })
  .catch(() => { employeeSelect.innerHTML = '<option>Xatolik — qayta yuklang</option>'; });

employeeSelect.addEventListener('change', checkShiftStatus);

// Xodim allaqachon ishdami — shuni tekshirib, tugmalarni mosalashtiramiz
async function checkShiftStatus() {
  const employeeId = employeeSelect.value;
  if (!employeeId) return;
  try {
    const res = await fetch(`${API_URL}/attendance/status/${employeeId}`);
    const data = await res.json();
    onShift = data.onShift;
    const box = document.getElementById('shiftStatus');
    if (onShift) {
      box.classList.add('on');
      document.getElementById('shiftStart').textContent = new Date(data.session.checkInAt).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('shiftOnStatus').textContent = data.session.lastZone === 'inside' ? 'Ishda (hududda)' : 'Ishda (hududdan tashqarida!)';
      const exits = data.session.zoneEvents.filter(e => e.type === 'exit').length;
      const zw = document.getElementById('zoneWarning');
      if (exits > 0) {
        zw.style.display = 'block';
        zw.textContent = `Bu smenada ${exits} marta hududdan chiqib ketgansiz`;
      } else zw.style.display = 'none';
      startPinging();
    } else {
      box.classList.remove('on');
      stopPinging();
    }
  } catch { /* status olishda xato — jim o'tkazamiz */ }
}

// Fon GPS kuzatuvi — faqat ishda bo'lganda ishlaydi
function startPinging() {
  if (pingTimer) return;
  pingTimer = setInterval(async () => {
    const employeeId = employeeSelect.value;
    if (!employeeId || currentLat == null) return;
    try {
      const res = await fetch(`${API_URL}/attendance/ping`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeId, latitude: currentLat, longitude: currentLon }),
      });
      const data = await res.json();
      if (!data.active) { stopPinging(); return; }
      checkShiftStatus(); // holatni yangilash (chiqdi/kirdi bo'lsa ko'rinishi uchun)
    } catch { /* tarmoq xatosi — keyingi pingda qayta urinadi */ }
  }, PING_INTERVAL_MS);
}
function stopPinging() {
  if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
}

// GPS kuzatish
function watchGPS() {
  if (!navigator.geolocation) { setGpsStatus('bad', "Brauzer joylashuvni qo'llab-quvvatlamaydi"); return; }
  navigator.geolocation.watchPosition(
    pos => {
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      setGpsStatus('ok', `Joylashuv aniqlandi (aniqlik: ${Math.round(pos.coords.accuracy)}m)`);
    },
    () => setGpsStatus('bad', 'Joylashuvga ruxsat bering (Sozlamalar)'),
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}
function setGpsStatus(kind, text) {
  const box = document.getElementById('gpsStatus');
  box.className = 'gps-status gps-' + kind;
  document.getElementById('gpsText').textContent = text;
}
watchGPS();

// Kamera
btnShoot.addEventListener('click', async () => {
  if (!capturedImage) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      btnShoot.textContent = '📸 Rasmga olish';
    } catch { showMsg('err', 'Kameraga ruxsat berilmadi'); }
  } else {
    takePhoto();
  }
});

function takePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedImage = canvas.toDataURL('image/jpeg', 0.8);
  preview.src = capturedImage;
  preview.style.display = 'block';
  video.style.display = 'none';
  stream.getTracks().forEach(t => t.stop());
  document.querySelector('.btn-row').style.display = 'none';

  // Faqat kerakli tugma(lar)ni ko'rsatamiz: ishda bo'lsa — Chiqish, bo'lmasa — Kirish
  btnCheckin.style.display = onShift ? 'none' : 'block';
  btnCheckout.style.display = onShift ? 'block' : 'none';
  actionRow.style.display = 'flex';
}

document.getElementById('btnRetake').addEventListener('click', () => {
  capturedImage = null;
  preview.style.display = 'none';
  placeholder.style.display = 'flex';
  actionRow.style.display = 'none';
  document.querySelector('.btn-row').style.display = 'flex';
  btnShoot.textContent = '📷 Kamerani yoqish';
});

btnCheckin.addEventListener('click', () => submitAttendance('checkin'));
btnCheckout.addEventListener('click', () => submitAttendance('checkout'));

async function submitAttendance(endpoint) {
  const employeeId = employeeSelect.value;
  if (!employeeId) return showMsg('err', 'Xodimni tanlang');
  if (!capturedImage) return showMsg('err', 'Avval rasmga oling');
  if (currentLat == null) return showMsg('err', 'Joylashuv hali aniqlanmadi, kuting');

  actionRow.querySelectorAll('button').forEach(b => b.disabled = true);
  showMsg('ok', 'Yuklanmoqda...');

  try {
    const uploadRes = await fetch(`${API_URL}/upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: capturedImage }),
    });
    const uploadData = await uploadRes.json();
    if (!uploadData.url) throw new Error('Rasm yuklanmadi');

    const res = await fetch(`${API_URL}/attendance/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ employeeId, photoUrl: uploadData.url, latitude: currentLat, longitude: currentLon }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('err', data.error || 'Xatolik yuz berdi');
    } else {
      const statusText = data.status === 'kech' ? ` — ${data.minutesDiff} daqiqa kech` : data.status === 'erta' ? ' — erta keldingiz' : '';
      showMsg('ok', `✓ ${endpoint === 'checkin' ? 'Kirish' : 'Chiqish'} qayd etildi${statusText}`);
      setTimeout(() => location.reload(), 2000);
    }
  } catch {
    showMsg('err', "Tarmoq xatoligi, qayta urinib ko'ring");
  }
  actionRow.querySelectorAll('button').forEach(b => b.disabled = false);
}

function showMsg(kind, text) {
  msgBox.innerHTML = `<div class="msg msg-${kind}">${text}</div>`;
}
</script>
</body>
</html>
