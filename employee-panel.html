<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mening panelim</title>
<style>
  :root { --orange:#ff9500; --orange-soft:#fff2e0; --green:#0d8a4f; --red:#e74c3c; --text:#1c1c1e; --text2:#8e8e93; --bg:#f2f1ed; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Inter',sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); min-height:100vh; }
  .wrap { max-width:460px; margin:0 auto; padding:18px 18px 100px; }

  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar h1 { font-size:20px; font-weight:800; color:var(--text); }
  .logout-pill { font-size:12px; color:var(--red); font-weight:700; background:#fdeaea; border:none; border-radius:20px; padding:7px 14px; }

  .month-nav { background:#fff; border-radius:18px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .month-nav .label { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--text); }
  .month-nav button { background:var(--bg); border:none; width:30px; height:30px; border-radius:10px; font-size:16px; color:var(--text2); }

  .stat-card { background:#fff; border-radius:20px; padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .stat-icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .ic-orange { background:var(--orange-soft); }
  .ic-red { background:#fdeaea; }
  .ic-peach { background:#fff2e0; }
  .stat-title { font-size:15px; font-weight:800; color:var(--text); flex:1; }
  .stat-pct { font-size:21px; font-weight:800; }
  .pct-good { color:var(--green); } .pct-mid { color:var(--orange); } .pct-bad { color:var(--red); }
  .bar-bg { height:7px; background:var(--bg); border-radius:4px; overflow:hidden; margin-bottom:10px; }
  .bar-fill { height:100%; border-radius:4px; transition:width .4s; }
  .stat-sub { font-size:13px; color:var(--text2); font-weight:600; }
  .stat-sub b { color:var(--text); font-weight:800; }

  .day-row { background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 3px rgba(0,0,0,.03); }
  .day-left { display:flex; align-items:center; gap:12px; }
  .day-badge { width:42px; height:42px; border-radius:13px; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .day-badge .num { font-size:15px; font-weight:800; color:var(--text); line-height:1; }
  .day-badge .mon { font-size:9px; color:var(--text2); font-weight:700; text-transform:uppercase; }
  .day-name { font-size:13px; font-weight:700; color:var(--text); }
  .day-sub { font-size:11px; color:var(--text2); margin-top:1px; }
  .day-right { text-align:right; }
  .day-hours { font-size:14px; font-weight:800; color:var(--text); }
  .day-delta { font-size:11px; font-weight:700; margin-top:2px; }
  .delta-late { color:var(--red); } .delta-ok { color:var(--green); } .delta-none { color:#c7c7cc; }

  .section-title { font-size:17px; font-weight:800; margin:22px 0 12px; color:var(--text); }
  .loading { text-align:center; padding:30px; color:var(--text2); font-weight:600; }

  /* Kirish/chiqish tab */
  .shift-status { background:#fff; border-radius:18px; padding:16px; margin-bottom:16px; display:none; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .shift-status.on { display:block; }
  .shift-status .row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--text2); font-weight:600; }
  .shift-status .row b { color:var(--text); }
  .zone-warning { background:#fdeaea; color:var(--red); border-radius:12px; padding:10px 14px; font-size:12px; font-weight:700; margin-top:8px; }

  .camera-box { background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:16px; position:relative; aspect-ratio:1; }
  video, .preview-img { width:100%; height:100%; object-fit:cover; display:block; }
  .camera-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#c7c7cc; }

  .gps-status { display:flex; align-items:center; gap:8px; background:#fff; border-radius:16px; padding:12px 16px; margin-bottom:16px; font-size:13px; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .gps-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .gps-ok { color:var(--green); } .gps-ok .gps-dot { background:var(--green); }
  .gps-wait { color:var(--orange); } .gps-wait .gps-dot { background:var(--orange); animation:pulse 1s infinite; }
  .gps-bad { color:var(--red); } .gps-bad .gps-dot { background:var(--red); }
  @keyframes pulse { 50%{opacity:.4} }

  .btn-row { display:flex; gap:10px; margin-bottom:12px; }
  button.action { border:none; border-radius:16px; padding:16px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; flex:1; }
  .btn-shoot { background:var(--text); color:#fff; }
  .btn-checkin { background:var(--green); color:#fff; }
  .btn-checkout { background:var(--red); color:#fff; }
  .btn-retake { background:#fff; color:var(--text2); border:1.5px solid #e5e5ea !important; }
  button:disabled { opacity:.4; }
  .msg { text-align:center; font-size:13px; padding:12px; border-radius:14px; margin-top:8px; font-weight:700; }
  .msg-ok { background:#e6f7ee; color:var(--green); }
  .msg-err { background:#fdeaea; color:var(--red); }

  /* Pastki tab navigatsiyasi */
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #ececec; display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom)); z-index:30; }
  .bn-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:6px; }
  .bn-icon { font-size:20px; color:#c7c7cc; }
  .bn-label { font-size:10px; font-weight:700; color:#c7c7cc; }
  .bn-item.active .bn-icon, .bn-item.active .bn-label { color:var(--orange); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 id="empNameHeader">—</h1>
    <button class="logout-pill" onclick="logout()">Chiqish</button>
  </div>

  <!-- ===== KIRISH/CHIQISH TAB ===== -->
  <div id="checkinTab">
    <div class="shift-status" id="shiftStatus">
      <div class="row">Smena boshlandi <b id="shiftStart">—</b></div>
      <div class="row">Holat <b id="shiftOnStatus">—</b></div>
      <div id="zoneWarning" style="display:none" class="zone-warning"></div>
    </div>

    <div class="gps-status gps-wait" id="gpsStatus">
      <div class="gps-dot"></div><span id="gpsText">Joylashuv aniqlanmoqda...</span>
    </div>

    <div class="camera-box">
      <video id="video" autoplay playsinline style="display:none"></video>
      <img id="preview" class="preview-img" style="display:none">
      <div class="camera-placeholder" id="placeholder">
        <span style="font-size:40px">📷</span><span style="font-size:13px; font-weight:600">Kamerani yoqish uchun bosing</span>
      </div>
    </div>
    <canvas id="canvas" style="display:none"></canvas>

    <div class="btn-row"><button class="action btn-shoot" id="btnShoot">📷 Kamerani yoqish</button></div>
    <div class="btn-row" id="actionRow" style="display:none">
      <button class="action btn-retake" id="btnRetake">↺ Qayta</button>
      <button class="action btn-checkin" id="btnCheckin">✓ Kirish</button>
      <button class="action btn-checkout" id="btnCheckout">✕ Chiqish</button>
    </div>
    <div id="msgBox"></div>
  </div>

  <!-- ===== STATISTIKA TAB ===== -->
  <div id="statsTab" style="display:none">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="label">📅 <span id="monthLabel">—</span></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div id="statsBox"><div class="loading">Yuklanmoqda...</div></div>
    <div class="section-title">Kunlar bo'yicha</div>
    <div id="daysBox"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="bn-item active" data-tab="checkin" onclick="switchTab('checkin')">
    <span class="bn-icon">🏠</span><span class="bn-label">Bosh sahifa</span>
  </button>
  <button class="bn-item" data-tab="stats" onclick="switchTab('stats')">
    <span class="bn-icon">📊</span><span class="bn-label">Davomat</span>
  </button>
</div>

<script>
// ====== SOZLAMALAR ======
const API_URL = 'https://YOUR-BACKEND.up.railway.app/api';
const PING_INTERVAL_MS = 2 * 60 * 1000;
// =========================

const EMPLOYEE_ID = localStorage.getItem('employeeId');
if (!EMPLOYEE_ID) location.href = 'employee-login.html';
document.getElementById('empNameHeader').textContent = localStorage.getItem('employeeName') || 'Xodim';

function logout() {
  localStorage.removeItem('employeeId');
  localStorage.removeItem('employeeName');
  location.href = 'employee-login.html';
}

function switchTab(tab) {
  document.querySelectorAll('.bn-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('checkinTab').style.display = tab === 'checkin' ? 'block' : 'none';
  document.getElementById('statsTab').style.display = tab === 'stats' ? 'block' : 'none';
  if (tab === 'stats') loadStats();
}

// ============ KIRISH/CHIQISH MANTIQI ============
let stream = null, capturedImage = null, currentLat = null, currentLon = null, onShift = false, pingTimer = null;

const video = document.getElementById('video'), preview = document.getElementById('preview');
const placeholder = document.getElementById('placeholder'), canvas = document.getElementById('canvas');
const btnShoot = document.getElementById('btnShoot'), btnCheckin = document.getElementById('btnCheckin'), btnCheckout = document.getElementById('btnCheckout');
const actionRow = document.getElementById('actionRow'), msgBox = document.getElementById('msgBox');

async function checkShiftStatus() {
  try {
    const res = await fetch(`${API_URL}/attendance/status/${EMPLOYEE_ID}`);
    const data = await res.json();
    onShift = data.onShift;
    const box = document.getElementById('shiftStatus');
    if (onShift) {
      box.classList.add('on');
      document.getElementById('shiftStart').textContent = new Date(data.session.checkInAt).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('shiftOnStatus').textContent = data.session.lastZone === 'inside' ? 'Ishda ✓' : 'Hududdan tashqarida ⚠';
      const exits = data.session.zoneEvents.filter(e => e.type === 'exit').length;
      const zw = document.getElementById('zoneWarning');
      if (exits > 0) { zw.style.display = 'block'; zw.textContent = `Bu smenada ${exits} marta hududdan chiqib ketgansiz`; }
      else zw.style.display = 'none';
      startPinging();
    } else {
      box.classList.remove('on'); stopPinging();
    }
  } catch {}
}
function startPinging() {
  if (pingTimer) return;
  pingTimer = setInterval(async () => {
    if (currentLat == null) return;
    try {
      const res = await fetch(`${API_URL}/attendance/ping`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ employeeId: EMPLOYEE_ID, latitude: currentLat, longitude: currentLon }) });
      const data = await res.json();
      if (!data.active) { stopPinging(); return; }
      checkShiftStatus();
    } catch {}
  }, PING_INTERVAL_MS);
}
function stopPinging() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }

function watchGPS() {
  if (!navigator.geolocation) { setGpsStatus('bad', "Qo'llab-quvvatlanmaydi"); return; }
  navigator.geolocation.watchPosition(
    pos => { currentLat = pos.coords.latitude; currentLon = pos.coords.longitude; setGpsStatus('ok', `Aniqlandi (±${Math.round(pos.coords.accuracy)}m)`); },
    () => setGpsStatus('bad', 'Joylashuvga ruxsat bering'),
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}
function setGpsStatus(kind, text) {
  const box = document.getElementById('gpsStatus');
  box.className = 'gps-status gps-' + kind;
  document.getElementById('gpsText').textContent = text;
}
watchGPS(); checkShiftStatus();

btnShoot.addEventListener('click', async () => {
  if (!capturedImage) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream; video.style.display = 'block'; placeholder.style.display = 'none';
      btnShoot.textContent = '📸 Rasmga olish';
    } catch { showMsg('err', 'Kameraga ruxsat berilmadi'); }
  } else takePhoto();
});
function takePhoto() {
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedImage = canvas.toDataURL('image/jpeg', 0.8);
  preview.src = capturedImage; preview.style.display = 'block'; video.style.display = 'none';
  stream.getTracks().forEach(t => t.stop());
  document.querySelector('#checkinTab .btn-row').style.display = 'none';
  btnCheckin.style.display = onShift ? 'none' : 'block';
  btnCheckout.style.display = onShift ? 'block' : 'none';
  actionRow.style.display = 'flex';
}
document.getElementById('btnRetake').addEventListener('click', () => {
  capturedImage = null; preview.style.display = 'none'; placeholder.style.display = 'flex';
  actionRow.style.display = 'none'; document.querySelector('#checkinTab .btn-row').style.display = 'flex';
  btnShoot.textContent = '📷 Kamerani yoqish';
});
btnCheckin.addEventListener('click', () => submitAttendance('checkin'));
btnCheckout.addEventListener('click', () => submitAttendance('checkout'));

async function submitAttendance(endpoint) {
  if (!capturedImage) return showMsg('err', 'Avval rasmga oling');
  if (currentLat == null) return showMsg('err', 'Joylashuv hali aniqlanmadi');
  actionRow.querySelectorAll('button').forEach(b => b.disabled = true);
  showMsg('ok', 'Yuklanmoqda...');
  try {
    const uploadRes = await fetch(`${API_URL}/upload`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: capturedImage }) });
    const uploadData = await uploadRes.json();
    if (!uploadData.url) throw new Error();
    const res = await fetch(`${API_URL}/attendance/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ employeeId: EMPLOYEE_ID, photoUrl: uploadData.url, latitude: currentLat, longitude: currentLon }) });
    const data = await res.json();
    if (!res.ok) showMsg('err', data.error || 'Xatolik');
    else {
      const statusText = data.status === 'kech' ? ` — ${data.minutesDiff} daqiqa kech` : data.status === 'erta' ? ' — erta keldingiz' : '';
      showMsg('ok', `✓ ${endpoint === 'checkin' ? 'Kirish' : 'Chiqish'} qayd etildi${statusText}`);
      setTimeout(() => location.reload(), 2000);
    }
  } catch { showMsg('err', "Tarmoq xatoligi"); }
  actionRow.querySelectorAll('button').forEach(b => b.disabled = false);
}
function showMsg(kind, text) { msgBox.innerHTML = `<div class="msg msg-${kind}">${text}</div>`; }

// ============ STATISTIKA MANTIQI ============
let currentDate = new Date();
function changeMonth(d) { currentDate.setMonth(currentDate.getMonth() + d); loadStats(); }
function fmtHM(hoursFloat) {
  const sign = hoursFloat < 0 ? '-' : '';
  const abs = Math.abs(hoursFloat);
  return `${sign}${Math.floor(abs)} soat ${Math.round((abs - Math.floor(abs)) * 60)} daqiqa`;
}

async function loadStats() {
  const months = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
  document.getElementById('monthLabel').textContent = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  const year = currentDate.getFullYear(), month = currentDate.getMonth() + 1;

  try {
    const [payrollRes, daysRes] = await Promise.all([
      fetch(`${API_URL}/payroll/${EMPLOYEE_ID}/${year}/${month}`).then(r => r.json()),
      fetch(`${API_URL}/attendance/employee/${EMPLOYEE_ID}/${year}/${month}/days`).then(r => r.json()),
    ]);

    const totalScheduled = payrollRes.totalScheduledDays || 0;
    const attendPct = totalScheduled ? Math.round((payrollRes.daysAttended / totalScheduled) * 100) : 0;
    const totalPlanned = daysRes.reduce((s, d) => s + d.plannedHours, 0) || 1;
    const hoursPct = Math.round((payrollRes.totalHours / totalPlanned) * 100);
    const missedPct = totalScheduled ? Math.round((payrollRes.daysMissed / totalScheduled) * 100) : 0;
    const lateDays = daysRes.filter(d => d.status === 'kech').length;
    const lateMinutesTotal = daysRes.filter(d => d.status === 'kech' && d.minutesDiff > 0).reduce((s, d) => s + d.minutesDiff, 0);
    const pctClass = p => p >= 80 ? 'pct-good' : p >= 50 ? 'pct-mid' : 'pct-bad';
    const barColor = p => p >= 80 ? 'var(--green)' : p >= 50 ? 'var(--orange)' : 'var(--red)';

    document.getElementById('statsBox').innerHTML = `
      <div class="stat-card">
        <div class="stat-top"><div class="stat-icon ic-orange">📋</div><span class="stat-title">Davomat</span><span class="stat-pct ${pctClass(attendPct)}">${attendPct}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${attendPct}%; background:${barColor(attendPct)}"></div></div>
        <div class="stat-sub"><b>${payrollRes.daysAttended}</b> / ${totalScheduled} kun</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-icon ic-peach">⏱️</div><span class="stat-title">Ish soatlari</span><span class="stat-pct ${pctClass(hoursPct)}">${hoursPct}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(hoursPct,100)}%; background:${barColor(hoursPct)}"></div></div>
        <div class="stat-sub"><b>${payrollRes.totalHours.toFixed(1)}</b> / ${totalPlanned.toFixed(0)} soat</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-icon ic-red">⏰</div><span class="stat-title">Kelmagan kunlar</span><span class="stat-pct pct-bad">${missedPct}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${missedPct}%; background:var(--red)"></div></div>
        <div class="stat-sub"><b>${payrollRes.daysMissed}</b> / ${totalScheduled} kun</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-icon ic-peach">📅</div><span class="stat-title">Kech kelgan kunlar</span><span class="stat-pct" style="color:var(--orange)">${lateDays} kun</span></div>
        <div class="stat-sub" style="color:var(--orange); font-weight:800; font-size:14px;">${fmtHM(lateMinutesTotal / 60)}</div>
      </div>`;

    const dayNames = ['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'];
    const monthShort = ['Yan','Fev','Mar','Apr','May','Iyun','Iyul','Avg','Sen','Okt','Noy','Dek'];
    document.getElementById('daysBox').innerHTML = daysRes.length === 0 ? '<div class="loading">Bu oyda smena yo\'q</div>' :
      daysRes.map(d => {
        const date = new Date(d.date);
        const deltaTxt = !d.attended ? '' : d.deltaMinutes < -5 ? `-${Math.abs(Math.round(d.deltaMinutes))} daq` : d.deltaMinutes > 5 ? `+${Math.round(d.deltaMinutes)} daq` : "O'z vaqtida";
        const deltaClass = !d.attended ? 'delta-none' : d.deltaMinutes < -5 ? 'delta-late' : 'delta-ok';
        return `<div class="day-row">
          <div class="day-left">
            <div class="day-badge"><div class="num">${date.getDate()}</div><div class="mon">${monthShort[date.getMonth()]}</div></div>
            <div><div class="day-name">${dayNames[date.getDay()]}shanba</div><div class="day-sub">${d.shiftName}</div></div>
          </div>
          <div class="day-right">
            <div class="day-hours">${d.attended ? d.actualHours.toFixed(1) + ' soat' : 'Kelmadi'}</div>
            ${d.attended ? `<div class="day-delta ${deltaClass}">${deltaTxt}</div>` : ''}
          </div>
        </div>`;
      }).join('');
  } catch { document.getElementById('statsBox').innerHTML = '<div class="loading">Xatolik</div>'; }
}
</script>
</body>
</html>
